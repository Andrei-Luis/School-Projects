<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LE1</title>
    </head>
    <body>
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" placeholder="Andrei Luis Nablo"> <br>
    
        <label for="age">Age:</label>
        <input type="number" name="age" id="age" placeholder="16"> <br>

        <label for="email">Email:</label>
        <input type="text" name="email" id="email" placeholder="RandomPPL@gmail.com"> <br>

        Gender: <br>
        <input name="gender" type="radio" id="male" value="male">Male
        <input name="gender" type="radio" id="female" value="female" >Female <br>

        Hobbies & Interests: <br>
        <input type="checkbox" name="programming" value="programming">Programming
        <input type="checkbox" name="reading" value="reading">Reading
        <input type="checkbox" name="films" value="films">Films
        <input type="checkbox" name="slacking" value="slacking">Slacking
        <br>

        <input type="submit" name="submit" id="submit">

    </body>
</html>
